name: Probe Zenodo publication secret

on:
  push:
    paths:
      - '.github/workflows/probe_zenodo_secret.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate secret names without exposing values
        env:
          Z1: ${{ secrets.ZENODO_TOKEN }}
          Z2: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          Z3: ${{ secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          if [ -n "${Z1:-}" ]; then echo "ZENODO_SECRET_NAME=ZENODO_TOKEN"; found=1; fi
          if [ -n "${Z2:-}" ]; then echo "ZENODO_SECRET_NAME=ZENODO_ACCESS_TOKEN"; found=1; fi
          if [ -n "${Z3:-}" ]; then echo "ZENODO_SECRET_NAME=ZENODO_PAT"; found=1; fi
          if [ "$found" -eq 0 ]; then
            echo "ZENODO_SECRET_NAME=NONE"
          fi

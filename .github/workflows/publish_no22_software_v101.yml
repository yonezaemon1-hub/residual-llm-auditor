name: Publish No.22 Software v1.0.1 to Zenodo

on:
  push:
    paths:
      - '.github/workflows/publish_no22_software_v101.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      OLD_DEPOSITION_ID: "23050737"
      NO22_REPO: yonezaemon1-hub/exact-codimension-two-reaching-thresholds-bcr
      NO22_TAG: v1.0.1
      ARCHIVE_NAME: exact-codimension-two-reaching-thresholds-bcr-v1.0.1.zip
    steps:
      - name: Require Zenodo token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          echo PASS_ZENODO_SECRET_PRESENT=true

      - name: Download v1.0.1 source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2             -o "$ARCHIVE_NAME"             "https://github.com/${NO22_REPO}/archive/refs/tags/${NO22_TAG}.zip"
          sha256sum "$ARCHIVE_NAME" | tee NO22_V101_SOURCE_SHA256.txt
          echo PASS_V101_DOWNLOAD=true

      - name: Create or reuse Zenodo new-version draft and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          token = os.environ["ZENODO_TOKEN"]
          old_id = int(os.environ["OLD_DEPOSITION_ID"])
          archive = os.environ["ARCHIVE_NAME"]
          api = "https://zenodo.org/api"
          title = "Exact Codimension-Two Reaching Thresholds for Binary Completely Reachable Automata — Reproducibility Package"

          def request(method, url, data=None, content_type=None):
              headers = {"Authorization": f"Bearer {token}"}
              if content_type:
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"ZENODO_HTTP_ERROR status={e.code} url={url}", file=sys.stderr)
                  print(body[:6000], file=sys.stderr)
                  raise

          _, old = request("GET", f"{api}/deposit/depositions/{old_id}")
          old_md = old.get("metadata") or {}
          if not old.get("submitted"):
              raise SystemExit("STOP_OLD_SOFTWARE_RECORD_NOT_PUBLISHED")

          # If a new-version draft already exists from a previous partial run, reuse it.
          draft = None
          latest_draft = (old.get("links") or {}).get("latest_draft")
          if latest_draft:
              try:
                  _, cand = request("GET", latest_draft)
                  if cand.get("id") != old_id and not cand.get("submitted"):
                      draft = cand
                      print(f"REUSED_LATEST_DRAFT_ID={draft.get('id')}")
                  elif cand.get("submitted") and str((cand.get("metadata") or {}).get("version")) == "1.0.1":
                      doi = (cand.get("metadata") or {}).get("doi") or ((cand.get("metadata") or {}).get("prereserve_doi") or {}).get("doi")
                      recid = cand.get("record_id") or cand.get("id")
                      if doi:
                          Path("NO22_V101_ZENODO_RESULT.json").write_text(json.dumps({
                              "status": "already_published",
                              "doi": doi,
                              "record_id": recid,
                              "deposition_id": cand.get("id"),
                              "archive": archive
                          }, indent=2) + "\n", encoding="utf-8")
                          print(f"NO22_SOFTWARE_V101_DOI={doi}")
                          print(f"NO22_SOFTWARE_V101_RECORD_ID={recid}")
                          print("PASS_NO22_SOFTWARE_V101_PUBLISHED=true")
                          raise SystemExit(0)
              except urllib.error.HTTPError:
                  pass

          if draft is None:
              _, nv = request(
                  "POST",
                  f"{api}/deposit/depositions/{old_id}/actions/newversion",
                  data=b"",
                  content_type="application/json"
              )
              latest_draft = (nv.get("links") or {}).get("latest_draft")
              if latest_draft:
                  _, draft = request("GET", latest_draft)
              else:
                  draft = nv
              print(f"CREATED_NEW_VERSION_DRAFT_ID={draft.get('id')}")

          draft_id = draft["id"]
          if draft.get("submitted"):
              raise SystemExit("STOP_SELECTED_DRAFT_ALREADY_SUBMITTED")
          bucket = (draft.get("links") or {}).get("bucket")
          if not bucket:
              raise SystemExit("STOP_NO_BUCKET_LINK")

          # A Zenodo new-version draft can inherit files. Replace them with the v1.0.1 source archive.
          for f in list(draft.get("files") or []):
              u = (f.get("links") or {}).get("self")
              if u:
                  request("DELETE", u)

          data = Path(archive).read_bytes()
          upload_url = bucket.rstrip("/") + "/" + urllib.parse.quote(archive)
          request("PUT", upload_url, data=data, content_type="application/octet-stream")
          print("PASS_V101_UPLOAD=true")

          metadata = dict(old_md)
          metadata.pop("doi", None)
          metadata.pop("prereserve_doi", None)
          metadata["title"] = title
          metadata["version"] = "1.0.1"
          metadata["publication_date"] = "2026-09-30"
          metadata["description"] = (
              "Reproducibility package for the exact codimension-two reaching threshold theorem "
              "in binary completely reachable automata. Version 1.0.1 is a manifest-only correction: "
              "the paper PDF, theorem, n=8 verifier, and frozen verification result are unchanged from "
              "v1.0.0; the SHA-256 manifest was regenerated over stable publication artifacts and "
              "excludes mutable CI workflow files."
          )
          metadata["related_identifiers"] = [
              {
                  "identifier": "https://github.com/yonezaemon1-hub/exact-codimension-two-reaching-thresholds-bcr/releases/tag/v1.0.1",
                  "relation": "isSupplementTo",
                  "scheme": "url"
              },
              {
                  "identifier": "10.5281/zenodo.23050727",
                  "relation": "isSupplementTo",
                  "scheme": "doi"
              }
          ]

          request(
              "PUT",
              f"{api}/deposit/depositions/{draft_id}",
              data=json.dumps({"metadata": metadata}).encode("utf-8"),
              content_type="application/json"
          )
          print("PASS_V101_METADATA=true")

          _, pub = request(
              "POST",
              f"{api}/deposit/depositions/{draft_id}/actions/publish",
              data=b"",
              content_type="application/json"
          )
          md = pub.get("metadata") or {}
          doi = md.get("doi") or (md.get("prereserve_doi") or {}).get("doi")
          recid = pub.get("record_id") or pub.get("id")
          if not doi:
              raise SystemExit("STOP_V101_PUBLISH_WITHOUT_DOI")

          result = {
              "status": "published",
              "doi": doi,
              "record_id": recid,
              "deposition_id": pub.get("id"),
              "archive": archive,
              "archive_sha256": Path("NO22_V101_SOURCE_SHA256.txt").read_text().split()[0]
          }
          Path("NO22_V101_ZENODO_RESULT.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(f"NO22_SOFTWARE_V101_DOI={doi}")
          print(f"NO22_SOFTWARE_V101_RECORD_ID={recid}")
          print("PASS_NO22_SOFTWARE_V101_PUBLISHED=true")
          PY

      - name: Show result
        shell: bash
        run: cat NO22_V101_ZENODO_RESULT.json
